name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-csharp:
    name: Analyze (csharp)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Retrieve Cities II dependencies
        id: dependencies
        shell: pwsh
        env:
          DEPENDENCIES_URL: ${{ secrets.DEPENDENCIESURL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_OBJECT_KEY: ${{ secrets.R2_OBJECT_KEY }}
        run: |
          $hasUrl = ![string]::IsNullOrWhiteSpace($env:DEPENDENCIES_URL)
          $hasR2 = ![string]::IsNullOrWhiteSpace($env:R2_ACCOUNT_ID) -and
            ![string]::IsNullOrWhiteSpace($env:R2_ACCESS_KEY_ID) -and
            ![string]::IsNullOrWhiteSpace($env:R2_SECRET_ACCESS_KEY) -and
            ![string]::IsNullOrWhiteSpace($env:R2_BUCKET)

          if (!$hasUrl -and !$hasR2) {
            "full-build=false" >> $env:GITHUB_OUTPUT
            "No dependency artifact source is configured; scanning the dependency-light C# logic project for CodeQL."
            exit 0
          }

          if ($hasUrl) {
            $dependenciesUrl = $env:DEPENDENCIES_URL.Trim().Trim([char]0xFEFF).Trim()
            $dependenciesUri = [Uri]$dependenciesUrl

            if ($dependenciesUri.AbsolutePath.TrimEnd("/") -ieq "/Managed.zip") {
              $downloadUrl = $dependenciesUrl
            } else {
              $downloadUri = [UriBuilder]$dependenciesUri
              $downloadUri.Path = "$($downloadUri.Path.TrimEnd('/'))/Managed.zip"
              $downloadUrl = $downloadUri.Uri.AbsoluteUri
            }

            $redactedUri = [UriBuilder]([Uri]$downloadUrl)
            $redactedUri.Query = ""
            "Downloading dependencies from $($redactedUri.Uri.AbsoluteUri)"

            $downloaded = $false
            for ($attempt = 1; $attempt -le 6 -and !$downloaded; $attempt++) {
              & curl.exe --fail --location --silent --show-error --retry 3 `
                --output Managed.zip `
                $downloadUrl

              if ($LASTEXITCODE -eq 0) {
                $downloaded = $true
                break
              }

              if ($attempt -lt 6) {
                Start-Sleep -Seconds 15
              }
            }

            if (!$downloaded) {
              throw "Could not download the managed dependency bundle."
            }
          } else {
            if ([string]::IsNullOrWhiteSpace($env:R2_OBJECT_KEY)) {
              $env:R2_OBJECT_KEY = "Managed.zip"
            }

            python -m pip install --disable-pip-version-check --quiet boto3
            @'
          import os
          import boto3

          endpoint_url = f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com"
          client = boto3.client(
              "s3",
              endpoint_url=endpoint_url,
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )
          client.download_file(os.environ["R2_BUCKET"], os.environ["R2_OBJECT_KEY"], "Managed.zip")
          '@ | python -
          }

          Expand-Archive -Path Managed.zip -DestinationPath . -Force

          if (!(Test-Path ".\Managed\Game.dll")) {
            throw "Managed.zip did not contain Managed\Game.dll."
          }

          if (!(Test-Path ".\Mod.props")) {
            @'
          <Project>
            <PropertyGroup>
              <CustomManagedPath Condition="'$(CustomManagedPath)' == ''">$([System.Environment]::GetEnvironmentVariable('CSII_MANAGEDPATH', 'EnvironmentVariableTarget.User'))</CustomManagedPath>
              <ModPropsFile>$(MSBuildThisFileFullPath)</ModPropsFile>
              <ModTargetsFile>$(MSBuildThisFileDirectory)Mod.targets</ModTargetsFile>
              <AssemblySearchPaths>$(CustomManagedPath);$(AssemblySearchPaths)</AssemblySearchPaths>
            </PropertyGroup>
            <ItemGroup>
              <ReferencePath Include="$(CustomManagedPath)\*.dll" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 -Path .\Mod.props
          }

          if (!(Test-Path ".\Mod.targets")) {
            @'
          <Project />
          '@ | Set-Content -Encoding utf8 -Path .\Mod.targets
          }

          [Environment]::SetEnvironmentVariable("CSII_TOOLPATH", (Get-Location).Path, "User")
          [Environment]::SetEnvironmentVariable("CSII_MANAGEDPATH", (Join-Path (Get-Location).Path "Managed"), "User")
          "full-build=true" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          source-root: ${{ steps.dependencies.outputs.full-build == 'true' && '.' || 'TrafficLightsEnhancement.Logic' }}

      - name: Restore
        shell: pwsh
        run: |
          if ("${{ steps.dependencies.outputs.full-build }}" -eq "true") {
            dotnet restore Cities2-TrafficLightsEnhancement.sln
          } else {
            dotnet restore TrafficLightsEnhancement.Logic/TrafficLightsEnhancement.Logic.csproj
          }

      - name: Build
        shell: pwsh
        run: |
          if ("${{ steps.dependencies.outputs.full-build }}" -eq "true") {
            dotnet build Cities2-TrafficLightsEnhancement.sln --configuration Release --no-restore --property:DisablePostProcessors=true
          } else {
            dotnet build TrafficLightsEnhancement.Logic/TrafficLightsEnhancement.Logic.csproj --configuration Release --no-restore
          }

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  analyze-scripted:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
